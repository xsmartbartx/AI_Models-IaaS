version: '3.8'

services:
  # --- 1. FastAPI Web Service ---
  api:
    build: .
    # Adjust "app.main:app" to point to your FastAPI instance
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    environment:
      # These use the internal Docker network hostnames ("db" and "redis")
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/appdb
      - CELERY_BROKER_URL=redis://redis:6379/0

  # --- 2. Celery Worker Service ---
  worker:
    build: .
    # Adjust "app.worker:celery" to point to your Celery app instance
    command: celery -A app.worker:celery worker --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/appdb
      - CELERY_BROKER_URL=redis://redis:6379/0

  # --- 3. Managed Redis (for Celery) ---
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # --- 4. Managed PostgreSQL ---
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: